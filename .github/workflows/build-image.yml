# Builds the production image for the server (linux/amd64), pushes it to the PRIVATE GitHub Container Registry and prints the DIGEST.
# The server deploys that digest, never a moving tag:   ./scripts/ops/deploy.sh ghcr.io/<owner>/kayas@sha256:<digest>
# Nothing here holds a secret: the push uses the job's own GITHUB_TOKEN. The package must stay PRIVATE (Packages settings), and the
# server logs in once with a read-only token (read:packages). The build needs a runner with enough memory (a standard GitHub-hosted
# runner has 16 GB; the 2 GB local VM could not finish `next build`).
name: Build and publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The runner's apt mirror (azure.archive.ubuntu.com) can fail to resolve for a while; fall back to the main archive only then.
      - name: apt mirror fallback
        run: |
          if ! getent hosts azure.archive.ubuntu.com >/dev/null; then
            echo "azure.archive.ubuntu.com does not resolve: using archive.ubuntu.com"
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g; s|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          fi
      # R17-06: the PDFs are checked by a real renderer (pdftoppm pixels, pdftotext word boxes), not by the writer's own width function
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --project unit
        env:
          REQUIRE_PDF_RENDERER: '1'

  image:
    name: Build and push (linux/amd64)
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kayas" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ steps.meta.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest to deploy
        run: |
          {
            echo "### Image published"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "Deploy this exact image on the server:"
            echo ""
            echo '```'
            echo "./scripts/ops/deploy.sh ${{ steps.meta.outputs.name }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Read by scripts/training/pick-image.sh: ties the digest to the exact commit it was built from.
          echo "IMAGE_REF=${{ steps.meta.outputs.name }}@${{ steps.build.outputs.digest }} COMMIT=${{ github.sha }}"
